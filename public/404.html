<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Practical Browser AI</title>
    <!--
      GitHub Pages serves this file for any path it does not recognise (every
      client-side route). We stash the originally requested URL in
      sessionStorage and bounce to index.html, where a small script restores it
      before React Router starts. This gives working deep links / refreshes on
      a static host that has no SPA fallback of its own.
    -->
    <script>
      sessionStorage.redirect = location.href
      location.replace('/practical-browser-ai/')
    </script>
  </head>
  <body></body>
</html>
